# Personal fork build: an unsigned (ad-hoc) Apple silicon PdfCraft with CAC/PIV smart card signing.
# Runs on GitHub's free macOS runner; the upstream release workflow uses a paid larger runner and signing secrets.
name: CAC Mac build

on:
  workflow_dispatch:
  push:
    branches: [cac-smart-card-signing]

permissions:
  contents: read

jobs:
  mac:
    runs-on: macos-14
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: rustup target add aarch64-apple-darwin
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cac-mac-${{ hashFiles('Cargo.lock') }}
      - name: Build and package (ad-hoc signed, not notarized)
        run: packaging/macos/package.sh --arch aarch64
      - uses: actions/upload-artifact@v4
        with:
          name: PdfCraft-CAC-macos-aarch64
          path: dist/release/*.dmg
          retention-days: 30
