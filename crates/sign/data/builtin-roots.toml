# Added for Documenso, whose signing certificates (WISeKey CertifyID Personal GB CA 3) chain to it.
# The pin is the root as found, byte for byte, in the signature of a Documenso-signed PDF and in
# Mozilla's root set (the system bundle of the build machine). `url` is the file WISeKey publishes
# (the one Mozilla's CA inclusion record names, `owgrgbca.crt`): it hashes to the pin, and its
# SHA-1 fingerprint, 0F:F9:40:76:18:D3:D7:6A:4B:98:F0:A8:35:9E:0C:FD:27:AC:CC:ED, is the one in
# that record. (`owgrgb.crt`, which this entry first had, answers 403.)
[[root]]
name = "OISTE WISeKey Global Root GB CA"
url = "https://public.wisekey.com/crt/owgrgbca.crt"
sha256 = "6b9c08e86eb0f767cfad65cd98b62149e5494a67f5845e7bd1ed019f27b86bd6"
checked_against = "mozilla-tls"
