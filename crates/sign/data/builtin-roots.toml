# Roots PdfCraft can trust when the user switches them on (crates/sign/src/trust.rs; off by
# default), for the commercial CAs behind most non-qualified PDF signatures. Each is fetched from the CA's own
# repository, never from Adobe (AGENTS.md 1.1), and pinned by the SHA-256 of its DER encoding:
# `cargo xtask trust-roots` refetches them all, fails on any difference and rewrites
# builtin-roots.der. `checked_against` names the independent source the pin was compared with:
#   mozilla-tls    Mozilla's TLS root program (as shipped by curl.se/ca and ca-certificates)
#   mozilla-email  Mozilla's S/MIME trust set (closer to document signing than TLS)
#   signed-pdf     the root inside a DocuSign-signed PDF's signature, byte for byte
# Adding a root is a trust decision: say why in the commit.

