[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "pdfcraft"
version = "0.5.0"
description = "Unified Document Processing SDK for PdfCraft (Issue #872)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT OR Apache-2.0" }
authors = [
    { name = "ArtCraft Team" }
]
keywords = ["pdf", "sdk", "document-processing", "pdfl-alternative", "rest"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Printing",
    "Topic :: Multimedia :: Graphics",
]

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "pdfcraft._native"
